[package]
name = "philharmonic-store"
version = "0.1.3"
edition = "2024"

license = "Apache-2.0 OR MPL-2.0"
repository = "https://github.com/metastable-void/philharmonic-store"
readme = "README.md"
rust-version = "1.88"
description = "Storage substrate traits for the Philharmonic workflow orchestration system: content store, identity store, entity store. Backend-agnostic; implementations in companion crates."

keywords = ["philharmonic", "storage", "content-addressed", "entity"]
categories = ["data-structures"]

[dependencies]
async-trait = { version = "0.1", default-features = false, features = [] }
philharmonic-types = "0.3.5"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
thiserror = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
overflow-checks = true
